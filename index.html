<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenMon Easy - Monitoring Greenhouse</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel Standalone untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // State Login & User
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [username, setUsername] = useState('Pak Farmer');
            const [activeTab, setActiveTab] = useState('dashboard');

            // State Sensor Greenhouse
            const [sensors, setSensors] = useState({
                temp: 28.5,
                humidityAir: 75,
                humiditySoil: 55,
                light: 840
            });

            // State Perangkat (Relay On/Off)
            const [devices, setDevices] = useState({
                waterPump: false,
                fan: true,
                growLight: false
            });

            // State Catatan Harian
            const [notes, setNotes] = useState([
                { id: 1, date: '02 Okt 2026', text: 'Memberikan pupuk cair organik pada tanaman Tomat zona A.' },
                { id: 2, date: '01 Okt 2026', text: 'Membersihkan filter ventilasi dan mengecek selang tetes.' }
            ]);
            const [newNote, setNewNote] = useState('');

            // Fungsi Simulasi Perubahan Cuaca
            const simulateWeather = (type) => {
                if (type === 'hot') {
                    setSensors({ temp: 34.2, humidityAir: 60, humiditySoil: 42, light: 1100 });
                } else if (type === 'rain') {
                    setSensors({ temp: 24.0, humidityAir: 90, humiditySoil: 75, light: 300 });
                } else {
                    setSensors({ temp: 28.5, humidityAir: 75, humiditySoil: 55, light: 840 });
                }
            };

            const toggleDevice = (dev) => {
                setDevices(prev => ({ ...prev, [dev]: !prev[dev] }));
            };

            const addNoteHandler = (e) => {
                e.preventDefault();
                if (!newNote.trim()) return;
                const today = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                setNotes([{ id: Date.now(), date: today, text: newNote }, ...notes]);
                setNewNote('');
            };

            // Halaman Login / Auth
            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-emerald-900 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-8">
                            <div className="text-center mb-6">
                                <div className="bg-emerald-100 text-emerald-700 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold shadow-inner">
                                    🌱
                                </div>
                                <h1 className="text-2xl font-bold text-emerald-900">GreenMon Easy</h1>
                                <p className="text-sm text-slate-500 mt-1">Sistem Pemantauan Greenhouse Ramah Pemula</p>
                            </div>

                            <form onSubmit={(e) => { e.preventDefault(); setIsLoggedIn(true); }} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Nama Petani / Pengelola</label>
                                    <input 
                                        type="text" 
                                        value={username}
                                        onChange={(e) => setUsername(e.target.value)}
                                        className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Kata Sandi (Demo bebas)</label>
                                    <input 
                                        type="password" 
                                        defaultValue="12345"
                                        className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                        required
                                    />
                                </div>
                                <button 
                                    type="submit"
                                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-md"
                                >
                                    Masuk ke Dashboard
                                </button>
                                <button 
                                    type="button"
                                    onClick={() => setIsLoggedIn(true)}
                                    className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 rounded-lg transition duration-200 text-sm"
                                >
                                    Mode Demo Cepat (Tanpa Password)
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    {/* Header */}
                    <header className="bg-emerald-800 text-white shadow-md sticky top-0 z-50">
                        <div className="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-2">
                                <span className="text-xl">🌿</span>
                                <span className="font-bold text-lg tracking-wide">GreenMon <span className="text-emerald-300 text-xs px-2 py-0.5 bg-emerald-900 rounded-full">Easy</span></span>
                            </div>
                            <div className="flex items-center space-x-3">
                                <div className="text-right hidden sm:block">
                                    <p className="text-xs text-emerald-200">Halo,</p>
                                    <p className="text-sm font-semibold">{username}</p>
                                </div>
                                <button 
                                    onClick={() => setIsLoggedIn(false)}
                                    className="bg-emerald-700 hover:bg-emerald-900 text-xs px-3 py-1.5 rounded-lg border border-emerald-600 transition"
                                >
                                    Keluar
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Navbar Tab */}
                    <nav className="bg-white border-b border-slate-200 shadow-sm">
                        <div className="max-w-5xl mx-auto px-4 flex space-x-6">
                            <button 
                                onClick={() => setActiveTab('dashboard')}
                                className={`py-3 font-medium text-sm border-b-2 transition ${activeTab === 'dashboard' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                            >
                                📊 Dashboard Utama
                            </button>
                            <button 
                                onClick={() => setActiveTab('control')}
                                className={`py-3 font-medium text-sm border-b-2 transition ${activeTab === 'control' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                            >
                                ⚙️ Kontrol Alat
                            </button>
                            <button 
                                onClick={() => setActiveTab('notes')}
                                className={`py-3 font-medium text-sm border-b-2 transition ${activeTab === 'notes' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                            >
                                📝 Catatan Harian
                            </button>
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="max-w-5xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

                        {/* TAB DASHBOARD */}
                        {activeTab === 'dashboard' && (
                            <>
                                {/* Status Tanaman Banner */}
                                <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 flex items-center justify-between shadow-sm">
                                    <div className="flex items-center space-x-3">
                                        <div className="text-3xl">✨</div>
                                        <div>
                                            <h2 className="font-bold text-emerald-900 text-base">Kondisi Greenhouse: Ideal & Aman</h2>
                                            <p className="text-xs text-emerald-700">Semua sensor berada di ambang batas normal untuk pertumbuhan tanaman.</p>
                                        </div>
                                    </div>
                                    <div className="hidden md:flex space-x-2">
                                        <button onClick={() => simulateWeather('normal')} className="text-xs bg-white border border-emerald-300 hover:bg-emerald-100 px-3 py-1.5 rounded-lg font-medium text-emerald-800 transition">Cuaca Normal</button>
                                        <button onClick={() => simulateWeather('hot')} className="text-xs bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg font-medium transition">Simulasi Panas</button>
                                        <button onClick={() => simulateWeather('rain')} className="text-xs bg-blue-500 hover:bg-blue-600 text-white px-3 py-1.5 rounded-lg font-medium transition">Simulasi Hujan</button>
                                    </div>
                                </div>

                                {/* Kartu 4 Sensor */}
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between">
                                        <div className="flex justify-between items-start text-slate-500 text-xs font-semibold mb-2">
                                            <span>SUHU UDARA</span>
                                            <span>🌡️</span>
                                        </div>
                                        <div>
                                            <span className="text-2xl md:text-3xl font-bold text-slate-800">{sensors.temp}</span>
                                            <span className="text-sm font-semibold text-slate-500 ml-1">°C</span>
                                        </div>
                                        <p className="text-[11px] text-emerald-600 mt-2 bg-emerald-50 inline-block px-2 py-0.5 rounded font-medium">Normal (Ideal: 24-32°C)</p>
                                    </div>

                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between">
                                        <div className="flex justify-between items-start text-slate-500 text-xs font-semibold mb-2">
                                            <span>KELEMBAPAN UDARA</span>
                                            <span>💧</span>
                                        </div>
                                        <div>
                                            <span className="text-2xl md:text-3xl font-bold text-slate-800">{sensors.humidityAir}</span>
                                            <span className="text-sm font-semibold text-slate-500 ml-1">%</span>
                                        </div>
                                        <p className="text-[11px] text-emerald-600 mt-2 bg-emerald-50 inline-block px-2 py-0.5 rounded font-medium">Cukup Baik</p>
                                    </div>

                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between">
                                        <div className="flex justify-between items-start text-slate-500 text-xs font-semibold mb-2">
                                            <span>KELEMBAPAN TANAH</span>
                                            <span>🌱</span>
                                        </div>
                                        <div>
                                            <span className="text-2xl md:text-3xl font-bold text-slate-800">{sensors.humiditySoil}</span>
                                            <span className="text-sm font-semibold text-slate-500 ml-1">%</span>
                                        </div>
                                        <p className={`text-[11px] mt-2 inline-block px-2 py-0.5 rounded font-medium ${sensors.humiditySoil < 50 ? 'bg-amber-50 text-amber-600' : 'bg-emerald-50 text-emerald-600'}`}>
                                            {sensors.humiditySoil < 50 ? 'Agak Kering (Perlu Siram)' : 'Lembap Optimal'}
                                        </p>
                                    </div>

                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between">
                                        <div className="flex justify-between items-start text-slate-500 text-xs font-semibold mb-2">
                                            <span>INTENSITAS CAHAYA</span>
                                            <span>☀️</span>
                                        </div>
                                        <div>
                                            <span className="text-2xl md:text-3xl font-bold text-slate-800">{sensors.light}</span>
                                            <span className="text-sm font-semibold text-slate-500 ml-1">lux</span>
                                        </div>
                                        <p className="text-[11px] text-emerald-600 mt-2 bg-emerald-50 inline-block px-2 py-0.5 rounded font-medium">Pencahayaan Cukup</p>
                                    </div>
                                </div>

                                {/* Panduan Cepat Pemula */}
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                                    <h3 className="font-bold text-slate-800 mb-3 text-sm flex items-center space-x-2">
                                        <span>💡 Tips Panduan Petani Pemula</span>
                                    </h3>
                                    <ul className="text-xs text-slate-600 space-y-2 list-disc list-inside">
                                        <li>Jika kelembapan tanah turun di bawah 50%, segeraaktifkan **Pompa Air** di menu Kontrol.</li>
                                        <li>Jika suhu udara melebihi 32°C, nyalakan **Kipas Ventilasi** untuk menurunkan hawa panas.</li>
                                        <li>Catat setiap kegiatan perawatan rutin pada tab **Catatan Harian** agar tidak terlewat.</li>
                                    </ul>
                                </div>
                            </>
                        )}

                        {/* TAB KONTROL ALAT */}
                        {activeTab === 'control' && (
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 space-y-6">
                                <div>
                                    <h2 className="font-bold text-slate-800 text-base">Panel Kontrol Perangkat Greenhouse</h2>
                                    <p className="text-xs text-slate-500">Nyalakan atau matikan peralatan penyiraman dan sirkulasi secara manual.</p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {/* Pompa Air */}
                                    <div className="border border-slate-200 rounded-xl p-4 flex items-center justify-between">
                                        <div>
                                            <p className="font-semibold text-sm text-slate-800">💧 Pompa Air Sprinkler</p>
                                            <p className="text-xs text-slate-500 mt-0.5">{devices.waterPump ? 'Sedang Menyiram...' : 'Mati / Siaga'}</p>
                                        </div>
                                        <button 
                                            onClick={() => toggleDevice('waterPump')}
                                            className={`px-4 py-2 rounded-lg text-xs font-semibold transition ${devices.waterPump ? 'bg-red-500 text-white hover:bg-red-600' : 'bg-emerald-600 text-white hover:bg-emerald-700'}`}
                                        >
                                            {devices.waterPump ? 'Matikan' : 'Nyalakan'}
                                        </button>
                                    </div>

                                    {/* Kipas */}
                                    <div className="border border-slate-200 rounded-xl p-4 flex items-center justify-between">
                                        <div>
                                            <p className="font-semibold text-sm text-slate-800">🌀 Kipas Ventilasi</p>
                                            <p className="text-xs text-slate-500 mt-0.5">{devices.fan ? 'Berputar (Pendinginan)' : 'Mati'}</p>
                                        </div>
                                        <button 
                                            onClick={() => toggleDevice('fan')}
                                            className={`px-4 py-2 rounded-lg text-xs font-semibold transition ${devices.fan ? 'bg-red-500 text-white hover:bg-red-600' : 'bg-emerald-600 text-white hover:bg-emerald-700'}`}
                                        >
                                            {devices.fan ? 'Matikan' : 'Nyalakan'}
                                        </button>
                                    </div>

                                    {/* Lampu */}
                                    <div className="border border-slate-200 rounded-xl p-4 flex items-center justify-between">
                                        <div>
                                            <p className="font-semibold text-sm text-slate-800">💡 Lampu Grow Light</p>
                                            <p className="text-xs text-slate-500 mt-0.5">{devices.growLight ? 'Aktif (Malam/Mendung)' : 'Mati'}</p>
                                        </div>
                                        <button 
                                            onClick={() => toggleDevice('growLight')}
                                            className={`px-4 py-2 rounded-lg text-xs font-semibold transition ${devices.growLight ? 'bg-red-500 text-white hover:bg-red-600' : 'bg-emerald-600 text-white hover:bg-emerald-700'}`}
                                        >
                                            {devices.growLight ? 'Matikan' : 'Nyalakan'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB CATATAN HARIAN */}
                        {activeTab === 'notes' && (
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 space-y-6">
                                <div>
                                    <h2 className="font-bold text-slate-800 text-base">Catatan Perawatan Harian Petani</h2>
                                    <p className="text-xs text-slate-500">Catat aktivitas penting seperti pemupukan, penyemprotan hama, atau pengecekan fisik tanaman.</p>
                                </div>

                                <form onSubmit={addNoteHandler} className="space-y-3">
                                    <textarea 
                                        value={newNote}
                                        onChange={(e) => setNewNote(e.target.value)}
                                        placeholder="Tulis catatan harian di sini (misal: Cek hama daun, beri pupuk tambahan)..."
                                        className="w-full p-3 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                        rows="3"
                                        required
                                    ></textarea>
                                    <button 
                                        type="submit"
                                        className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-5 py-2.5 rounded-lg transition"
                                    >
                                        Simpan Catatan Baru
                                    </button>
                                </form>

                                <div className="space-y-3 pt-4 border-t border-slate-100">
                                    <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider">Riwayat Catatan</h3>
                                    {notes.map(note => (
                                        <div key={note.id} className="bg-slate-50 p-3 rounded-lg border border-slate-200 flex justify-between items-start">
                                            <div>
                                                <p className="text-xs font-semibold text-emerald-800 mb-1">{note.date}</p>
                                                <p className="text-xs text-slate-700">{note.text}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Footer */}
                    <footer className="text-center py-4 text-xs text-slate-400 border-t border-slate-200 mt-auto">
                        GreenMon Easy &bull; Dibuat khusus untuk kemudahan pemula &bull; 2026
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
